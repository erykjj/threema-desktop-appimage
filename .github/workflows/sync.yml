name: Sync with Upstream

on:
  schedule:
    - cron: '0 11 * * *'  # Daily at 11:00 UTC
  workflow_dispatch:

jobs:
  sync-fork:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/threema-ch/threema-desktop.git
          git fetch upstream

      - name: Hard reset to upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git reset --hard upstream/stable
          git push --force origin HEAD:stable
          echo "Fork forcefully synced with upstream"